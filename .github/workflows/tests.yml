name: Run Laravel Tests

on: [push, pull_request]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ${{ secrets.TEST_DB_NAME }}
          MYSQL_USER: ${{ secrets.TEST_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.TEST_DB_PASS }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u${{ secrets.TEST_DB_USER }} -p${{ secrets.TEST_DB_PASS }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Set Laravel environment variables
        run: |
          php artisan key:generate
          sed -i "s|DB_DATABASE=.*|DB_DATABASE=${{ secrets.TEST_DB_NAME }}|" .env
          sed -i "s|DB_USERNAME=.*|DB_USERNAME=${{ secrets.TEST_DB_USER }}|" .env
          sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=${{ secrets.TEST_DB_PASS }}|" .env
          sed -i "s|DB_HOST=.*|DB_HOST=127.0.0.1|" .env
          sed -i "s|DB_PORT=.*|DB_PORT=3306|" .env

      - name: Wait for MySQL
        run: |
          for i in {1..15}; do
            if mysqladmin ping -h127.0.0.1 -u${{ secrets.TEST_DB_USER }} -p${{ secrets.TEST_DB_PASS }} --silent; then
              break
            fi
            echo "Waiting for MySQL..."
            sleep 3
          done

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test --process-isolation